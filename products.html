<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>All Products — CRAZY FLIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <a href="index.html" class="logo">CRAZY<span>FLIP</span></a>
  <nav class="nav-links">
    <a href="index.html">HOME</a>
    <a href="products.html">PRODUCTS</a>
  </nav>
</header>

<section class="container">
  <h2 class="page-title">ALL PRODUCTS</h2>
  <div class="products-grid" id="productsGrid">
    <div class="loading">Loading...</div>
  </div>
</section>

<footer class="footer">
  <p>CRAZY FLIP © 2026</p>
</footer>

<script type="module">

const firebaseConfig = {
  apiKey: "AIzaSyAtCagT7Al29I_WLsG4AFfy-DKGi_svA9A",
  authDomain: "crazy-flip-be56c.firebaseapp.com",
  databaseURL: "https://crazy-flip-be56c-default-rtdb.firebaseio.com",
  projectId: "crazy-flip-be56c",
  storageBucket: "crazy-flip-be56c.firebasestorage.app",
  messagingSenderId: "298724582283",
  appId: "1:298724582283:web:8e30164a256fe1fe96858e"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

(async () => {
  try {
    const snap = await get(ref(db, 'products'));
    const data = snap.val() || {};
    const products = Object.keys(data).map(id => ({ id, ...data[id] }));
    const grid = document.getElementById('productsGrid');

    if (!products.length) {
      grid.innerHTML = '<div class="loading">No products yet.</div>';
      return;
    }
    grid.innerHTML = products.map((p, i) => `
      <div class="product-card" style="animation-delay:${i * .05}s">
        <img src="${p.image}" alt="${p.name}"
          onerror="this.src='https://via.placeholder.com/300x180/111/fff?text=CF'"/>
        <div class="pc-body">
          <div class="pc-name">${p.name}</div>
          <div class="pc-price">Starting <b>GH₵ ${p.plans?.[0]?.price ?? 0}</b></div>
          <a href="product-details.html?id=${p.id}" class="btn-view">VIEW PRODUCT</a>
        </div>
      </div>
    `).join('');
  } catch (e) {
    console.error(e);
    document.getElementById('productsGrid').innerHTML =
      '<div class="loading">Failed to load products.</div>';
  }
})();

</script>

</body>
</html>
