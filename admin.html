<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="admin-wrap">
  <aside class="sidebar">
    <a href="index.html" class="side-logo">CRAZY<span>FLIP</span></a>
    <nav>
      <a class="nav-btn active" href="admin.html">📊 Dashboard</a>
      <a class="nav-btn" href="admin-orders.html">📦 Orders</a>
      <a class="nav-btn" href="admin-products.html">🛍️ Products</a>
      <a class="nav-btn" href="admin-banner.html">🖼️ Banner Manager</a>
      <a class="nav-btn" href="admin-settings.html">⚙️ Website Settings</a>
    </nav>
  </aside>

  <main class="main">
    <h1>Dashboard</h1>

    <div class="stats-grid">
      <div class="stat-card"><h3>TOTAL ORDERS</h3><p id="stTotal">0</p></div>
      <div class="stat-card"><h3>PENDING</h3><p id="stPending">0</p></div>
      <div class="stat-card"><h3>COMPLETED</h3><p id="stCompleted">0</p></div>
      <div class="stat-card"><h3>REVENUE (GH₵)</h3><p id="stRevenue">0</p></div>
    </div>

    <h2 class="section-sub">QUICK ACTIONS</h2>
    <div class="quick-grid">
      <a href="admin-products.html" class="quick-card">
        <div class="quick-icon">🛍️</div>
        <div class="quick-label">ADD PRODUCT</div>
      </a>
      <a href="admin-banner.html" class="quick-card">
        <div class="quick-icon">🖼️</div>
        <div class="quick-label">ADD BANNER</div>
      </a>
      <a href="admin-orders.html" class="quick-card">
        <div class="quick-icon">📦</div>
        <div class="quick-label">VIEW ORDERS</div>
      </a>
      <a href="admin-settings.html" class="quick-card">
        <div class="quick-icon">⚙️</div>
        <div class="quick-label">SETTINGS</div>
        <div class="quick-desc">MoMo, WhatsApp, Telegram</div>
      </a>
      <a href="index.html" target="_blank" class="quick-card">
        <div class="quick-icon">🌐</div>
        <div class="quick-label">VIEW WEBSITE</div>
      </a>
    </div>
  </main>
</div>

<script type="module">

const firebaseConfig = {
  apiKey: "AIzaSyAtCagT7Al29I_WLsG4AFfy-DKGi_svA9A",
  authDomain: "crazy-flip-be56c.firebaseapp.com",
  databaseURL: "https://crazy-flip-be56c-default-rtdb.firebaseio.com",
  projectId: "crazy-flip-be56c",
  storageBucket: "crazy-flip-be56c.firebasestorage.app",
  messagingSenderId: "298724582283",
  appId: "1:298724582283:web:8e30164a256fe1fe96858e"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

onValue(ref(db, 'orders'), snap => {
  const data = snap.val() || {};
  const orders = Object.keys(data).map(id => ({ id, ...data[id] }));
  document.getElementById('stTotal').textContent = orders.length;
  document.getElementById('stPending').textContent =
    orders.filter(o => o.status === 'Pending').length;
  document.getElementById('stCompleted').textContent =
    orders.filter(o => o.status === 'Completed').length;
  document.getElementById('stRevenue').textContent =
    orders.filter(o => o.status === 'Completed')
          .reduce((s, o) => s + (Number(o.price) || 0), 0);
});

</script>

</body>
</html>
