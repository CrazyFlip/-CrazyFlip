<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Payment — CRAZY FLIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <a href="index.html" class="logo">CRAZY<span>FLIP</span></a>
  <nav class="nav-links">
    <a href="index.html">HOME</a>
    <a href="products.html">PRODUCTS</a>
  </nav>
</header>

<section class="container">
  <div class="payment-wrap" id="paymentWrap">
    <div class="loading">Loading...</div>
  </div>
</section>

<footer class="footer">
  <p>CRAZY FLIP © 2026</p>
</footer>

<script type="module">

console.log('💳 Payment page loading...');

const firebaseConfig = {
  apiKey: "AIzaSyAtCagT7Al29I_WLsG4AFfy-DKGi_svA9A",
  authDomain: "crazy-flip-be56c.firebaseapp.com",
  databaseURL: "https://crazy-flip-be56c-default-rtdb.firebaseio.com",
  projectId: "crazy-flip-be56c",
  storageBucket: "crazy-flip-be56c.firebasestorage.app",
  messagingSenderId: "298724582283",
  appId: "1:298724582283:web:8e30164a256fe1fe96858e"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getDatabase, ref, get, push, set
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const params = new URLSearchParams(window.location.search);
const productId = params.get('id');
const planIndex = Number(params.get('planIndex') || 0);

console.log('📦 Product ID:', productId);
console.log('🎯 Plan Index:', planIndex);

let currentProduct = null;
let currentPlan = null;
let settings = {};

(async () => {
  const wrap = document.getElementById('paymentWrap');

  if (!productId) {
    wrap.innerHTML = '<div class="loading">Invalid request. No product ID.</div>';
    return;
  }

  try {
    /* Settings load */
    const sSnap = await get(ref(db, 'settings'));
    settings = sSnap.val() || {};
    console.log('⚙️ Settings:', settings);

    /* Product load */
    const pSnap = await get(ref(db, 'products/' + productId));
    currentProduct = pSnap.val();

    if (!currentProduct) {
      wrap.innerHTML = '<div class="loading">Product not found in database.</div>';
      return;
    }

    currentProduct.id = productId;
    console.log('✅ Product loaded:', currentProduct);

    /* Plan check */
    if (!currentProduct.plans || !currentProduct.plans.length) {
      wrap.innerHTML = '<div class="loading">No plans available for this product.</div>';
      return;
    }

    currentPlan = currentProduct.plans[planIndex] || currentProduct.plans[0];
    console.log('✅ Plan selected:', currentPlan);

    renderPayment();
  } catch (e) {
    console.error('❌ Load error:', e);
    wrap.innerHTML = '<div class="loading">Failed to load. Check console.</div>';
  }
})();

function renderPayment() {
  const wrap = document.getElementById('paymentWrap');
  wrap.innerHTML = `
    <h2 class="pay-title">PAYMENT</h2>

    <div class="pay-info">
      <div class="pay-row"><span>Product</span><b>${currentProduct.name}</b></div>
      <div class="pay-row"><span>Plan</span><b>${currentPlan.name}</b></div>
      <div class="pay-row"><span>Total Price</span><b>GH₵ ${currentPlan.price}</b></div>
      <div class="pay-row"><span>Method</span><b>Ghana Cedis (GHS)</b></div>
    </div>

    <div class="pay-box">
      <p style="color:#bbb; font-size:13px; margin-bottom:12px; font-weight:500">
        ${settings.paymentText || 'Send money to the number below, then enter your details.'}
      </p>
      <div class="momo-row">
        <span>MoMo Number</span>
        <b id="momoNum">${settings.momoNumber || 'Not set'}</b>
        <button class="copy-btn" id="copyMomo">COPY</button>
      </div>
      <div class="momo-row">
        <span>Account Name</span>
        <b>${settings.accountName || 'Not set'}</b>
      </div>
    </div>

    <div class="form-group">
      <label>YOUR WHATSAPP NUMBER</label>
      <input id="inpWhatsapp" type="text" placeholder="+233XXXXXXXXX" />
    </div>
    <div class="form-group">
      <label>TRANSACTION ID</label>
      <input id="inpTxid" type="text" placeholder="TX123456" />
    </div>

    <div class="confirm-buttons">
      <button class="btn-primary" id="btnWhatsapp">CONFIRM VIA WHATSAPP</button>
      <button class="btn-secondary" id="btnTelegram">CONFIRM VIA TELEGRAM</button>
    </div>
  `;

  document.getElementById('copyMomo').onclick = () => {
    const momo = settings.momoNumber || '';
    if (!momo) return alert('MoMo number set করা নেই');
    navigator.clipboard.writeText(momo);
    const b = document.getElementById('copyMomo');
    b.textContent = 'COPIED!';
    setTimeout(() => b.textContent = 'COPY', 1500);
  };

  document.getElementById('btnWhatsapp').onclick = () => confirmOrder('WhatsApp');
  document.getElementById('btnTelegram').onclick = () => confirmOrder('Telegram');
}

async function confirmOrder(source) {
  const wp = document.getElementById('inpWhatsapp').value.trim();
  const tx = document.getElementById('inpTxid').value.trim();

  if (!wp) return alert('WhatsApp number দিন!');
  if (!tx) return alert('Transaction ID দিন!');

  const btn = document.getElementById(source === 'WhatsApp' ? 'btnWhatsapp' : 'btnTelegram');
  btn.textContent = 'SAVING...';
  btn.disabled = true;

  const now = new Date();
  const dateStr = now.toLocaleString('en-GB', {
    day: '2-digit', month: '2-digit', year: 'numeric',
    hour: '2-digit', minute: '2-digit'
  });

  /* Order ID generate */
  let orderId = 'CF-1001';
  try {
    const countSnap = await get(ref(db, 'orders'));
    const count = Object.keys(countSnap.val() || {}).length;
    orderId = `CF-${1001 + count}`;
    console.log('🆔 Order ID:', orderId);
  } catch (e) {
    console.warn('Order ID count failed, using default', e);
  }

  const orderData = {
    orderId,
    product: currentProduct.name,
    plan: currentPlan.name,
    price: Number(currentPlan.price) || 0,
    whatsappNumber: wp,
    transactionId: tx,
    date: dateStr,
    status: 'Pending',
    source: source,
    createdAt: Date.now()
  };

  console.log('💾 Saving order:', orderData);

  try {
    const newRef = push(ref(db, 'orders'));
    await set(newRef, orderData);
    console.log('✅ Order saved:', newRef.key);
  } catch (err) {
    console.error('❌ Save error:', err);
    alert('❌ Order save failed: ' + err.message);
    btn.textContent = source === 'WhatsApp' ? 'CONFIRM VIA WHATSAPP' : 'CONFIRM VIA TELEGRAM';
    btn.disabled = false;
    return;
  }

  const msg =
`Order ID: ${orderId}

Product: ${currentProduct.name}
Plan: ${currentPlan.name}
Price: GH₵ ${currentPlan.price}

WhatsApp Number:
${wp}

Transaction ID:
${tx}`;

  const encoded = encodeURIComponent(msg);

  if (source === 'WhatsApp') {
    const num = (settings.whatsapp || '').replace(/\D/g, '');
    if (!num) {
      alert('✅ Order saved! But admin WhatsApp number set করা নেই।\n\nAdmin Settings এ গিয়ে WhatsApp number যোগ করুন।');
      setTimeout(() => window.location.href = 'index.html', 1500);
      return;
    }
    window.open(`https://wa.me/${num}?text=${encoded}`, '_blank');
  } else {
    const tg = (settings.telegram || '').replace('@', '');
    if (!tg) {
      alert('✅ Order saved! But admin Telegram set করা নেই।\n\nAdmin Settings এ গিয়ে Telegram username যোগ করুন।');
      setTimeout(() => window.location.href = 'index.html', 1500);
      return;
    }
    navigator.clipboard.writeText(msg);
    window.open(`https://t.me/${tg}`, '_blank');
    setTimeout(() => alert('Order saved! Telegram এ message paste করে পাঠান।'), 500);
  }

  setTimeout(() => {
    window.location.href = 'index.html';
  }, 1500);
}

</script>

</body>
</html>
