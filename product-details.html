<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Product Details — CRAZY FLIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <a href="index.html" class="logo">CRAZY<span>FLIP</span></a>
  <nav class="nav-links">
    <a href="index.html">HOME</a>
    <a href="products.html">PRODUCTS</a>
    <a href="admin.html">ADMIN</a>
  </nav>
</header>

<section class="container">
  <div class="product-detail-wrap" id="detailWrap">
    <div class="loading">Loading...</div>
  </div>
</section>

<footer class="footer">
  <p>CRAZY FLIP © 2026</p>
</footer>

<script type="module">

const firebaseConfig = {
  apiKey: "AIzaSyAtCagT7Al29I_WLsG4AFfy-DKGi_svA9A",
  authDomain: "crazy-flip-be56c.firebaseapp.com",
  databaseURL: "https://crazy-flip-be56c-default-rtdb.firebaseio.com",
  projectId: "crazy-flip-be56c",
  storageBucket: "crazy-flip-be56c.firebasestorage.app",
  messagingSenderId: "298724582283",
  appId: "1:298724582283:web:8e30164a256fe1fe96858e"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const params = new URLSearchParams(window.location.search);
const productId = params.get('id');
let currentProduct = null;
let currentPlan = null;

(async () => {
  const wrap = document.getElementById('detailWrap');
  if (!productId) {
    wrap.innerHTML = '<div class="loading">Product not found.</div>';
    return;
  }
  try {
    const snap = await get(ref(db, 'products/' + productId));
    currentProduct = snap.val();
    if (!currentProduct) {
      wrap.innerHTML = '<div class="loading">Product not found.</div>';
      return;
    }
    renderDetail();
  } catch (e) {
    console.error(e);
    wrap.innerHTML = '<div class="loading">Failed to load.</div>';
  }
})();

function renderDetail() {
  const p = currentProduct;
  const plans = p.plans || [];
  currentPlan = plans[0] || null;

  const wrap = document.getElementById('detailWrap');
  wrap.innerHTML = `
    <img src="${p.image}" alt="${p.name}"
      onerror="this.src='https://via.placeholder.com/500x500/111/fff?text=CF'"/>
    <div class="pd-info">
      <h1>${p.name}</h1>
      <p class="pd-desc">${p.description || ''}</p>
      <h3>CHOOSE PLAN:</h3>
      <div class="plans" id="plansBox">
        ${plans.map((pl, i) => `
          <div class="plan-item ${i === 0 ? 'active' : ''}" data-i="${i}">
            <span>${pl.name}</span>
            <b>GH₵ ${pl.price}</b>
          </div>
        `).join('')}
      </div>
      <div class="pd-total">Total: <span id="totalPrice">GH₵ ${currentPlan?.price ?? 0}</span></div>
      <button class="btn-primary" id="buyNowBtn">BUY NOW</button>
    </div>
  `;

  document.querySelectorAll('.plan-item').forEach(item => {
    item.onclick = () => {
      document.querySelectorAll('.plan-item').forEach(x => x.classList.remove('active'));
      item.classList.add('active');
      currentPlan = plans[+item.dataset.i];
      document.getElementById('totalPrice').textContent = `GH₵ ${currentPlan.price}`;
    };
  });

  document.getElementById('buyNowBtn').onclick = () => {
    if (!currentPlan) return alert('Select a plan');
    window.location.href =
      `payment.html?id=${p.id}&planIndex=${plans.indexOf(currentPlan)}`;
  };
}

</script>

</body>
</html>
