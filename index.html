<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CRAZY FLIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#000;
  color:#fff;
  font-family:'Poppins',sans-serif;
  font-weight:700;
  overflow-x:hidden;
}

/* ============ HEADER ============ */
.header {
  position:sticky; top:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 5%;
  background:#000;
  border-bottom:1px solid #1a1a1a;
}
.logo {
  font-size:22px; font-weight:900;
  letter-spacing:1px; color:#fff; text-decoration:none;
}
.logo span { opacity:.5; }
.nav-links { display:flex; gap:18px; align-items:center; }
.nav-links a {
  color:#fff; text-decoration:none;
  font-size:13px; font-weight:800; letter-spacing:1px;
  transition:.3s;
}
.nav-links a:hover { opacity:.6; }

/* ============ BANNER SLIDER ============ */
.banner-slider {
  position: relative;
  width: 100%;
  margin: 0;
  padding: 0;
  border-radius: 0;
  overflow: hidden;
  background: #000;
  display: block;
  line-height: 0;
  font-size: 0;
  height: auto;
}
.banner-slide {
  display: none;
  position: relative;
  width: 100%;
  margin: 0;
  padding: 0;
  height: auto;
  line-height: 0;
  font-size: 0;
}
.banner-slide.active { display: block; }
.banner-slide img {
  display: block;
  width: 100%;
  height: auto;
  margin: 0;
  padding: 0;
  vertical-align: top;
}
.banner-slide .banner-title {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: 16px 20px;
  background: linear-gradient(0deg, rgba(0,0,0,.7) 0%, rgba(0,0,0,0) 100%);
  color: #fff;
  font-size: 14px;
  font-weight: 900;
  text-align: left;
  letter-spacing: 1px;
  line-height: 1.2;
  text-shadow: 0 2px 12px rgba(0,0,0,.9);
}
.banner-dots {
  position: absolute;
  bottom: 10px;
  right: 12px;
  display: flex;
  gap: 6px;
  z-index: 5;
}
.banner-dots span {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: rgba(255,255,255,.4);
  cursor: pointer;
  transition: .3s;
  display: inline-block;
}
.banner-dots span.active {
  background: #fff;
  width: 22px;
  border-radius: 4px;
}

/* ============ SUPPORT SECTION ============ */
.support-section {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 10px 5% 30px;
}
.support-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.support-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 16px 18px;
  border-radius: 12px;
  font-weight: 900;
  font-size: 13px;
  letter-spacing: 1px;
  text-decoration: none;
  color: #000;
  transition: .3s;
  border: 1px solid #1a1a1a;
  background: #0a0a0a;
  color: #fff;
}
.support-btn:hover {
  transform: translateY(-3px);
  border-color: #fff;
}
.support-btn svg {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
}
.support-btn.whatsapp {
  background: #fff;
  color: #000;
  border-color: #fff;
}
.support-btn.whatsapp:hover {
  background: #e0e0e0;
}
.support-btn.telegram {
  background: #0a0a0a;
  color: #fff;
  border: 1px solid #333;
}
.support-btn.telegram:hover {
  background: #111;
  border-color: #fff;
}

/* ============ PRODUCTS SECTION ============ */
.products-section {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 10px 5% 60px;
}
.section-title {
  font-size:22px; font-weight:900;
  text-align:center;
  margin-bottom:22px;
  letter-spacing:2px;
  padding-top: 8px;
}
.products-grid {
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:14px;
}
.product-card {
  background:#0a0a0a;
  border:1px solid #1a1a1a;
  border-radius:14px;
  overflow:hidden;
  transition:.4s cubic-bezier(.2,.8,.2,1);
  animation:fadeUp .6s ease both;
}
.product-card:hover {
  transform:translateY(-6px);
  border-color:#fff;
}
.product-card img {
  width:100%;
  aspect-ratio: 1 / 1;
  object-fit:cover;
  transition:.5s;
  display:block;
}
.product-card:hover img { transform:scale(1.06); }
.pc-body { padding:14px; }
.pc-name {
  font-size:14px; font-weight:800;
  margin-bottom:6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.pc-price {
  font-size:12px; color:#bbb;
  margin-bottom:12px; font-weight:600;
}
.pc-price b { color:#fff; font-size:15px; font-weight:900; }
.btn-view {
  display:block; width:100%;
  padding:10px;
  background:#fff; color:#000;
  border-radius:8px;
  font-weight:900; font-size:12px;
  letter-spacing:1px;
  transition:.3s;
  text-align:center;
  text-decoration:none;
}
.btn-view:hover {
  background:#ccc;
  transform:scale(1.02);
}
.loading {
  grid-column:1/-1;
  text-align:center;
  padding:60px 20px;
  color:#666;
  font-size:14px;
}

/* ============ FOOTER ============ */
.footer {
  padding:24px 5%;
  border-top:1px solid #1a1a1a;
  text-align:center;
  color:#888;
  font-size:12px;
  font-weight:600;
}
.footer-contact {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.footer-contact a {
  color: #fff;
  text-decoration: none;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 1px;
  transition: .3s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.footer-contact a:hover { opacity: .6; }
.footer-contact svg {
  width: 16px;
  height: 16px;
}

@keyframes fadeUp {
  from { opacity:0; transform:translateY(20px); }
  to   { opacity:1; transform:translateY(0); }
}

/* ============ TABLET & DESKTOP ============ */
@media (min-width: 769px) {
  .header { padding:18px 6%; }
  .logo { font-size:24px; }
  .nav-links { gap:22px; }
  .nav-links a { font-size:14px; }

  .banner-slider {
    max-width: 1200px;
    margin: 30px auto 0;
    border-radius: 16px;
    border: 1px solid #1a1a1a;
  }
  .banner-slide .banner-title {
    font-size: 24px;
    padding: 24px 32px;
    letter-spacing: 2px;
  }

  .support-section {
    padding: 20px 6% 30px;
  }
  .support-buttons {
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    max-width: 700px;
    margin: 0 auto;
  }
  .support-btn {
    padding: 18px 24px;
    font-size: 14px;
  }

  .section-title { font-size:32px; margin-bottom:36px; }
  .products-grid {
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 22px;
  }
  .pc-name { font-size:16px; }
  .pc-price { font-size:13px; }
}

@media (max-width: 380px) {
  .products-grid { gap: 10px; }
  .pc-body { padding: 10px; }
  .pc-name { font-size: 12px; }
  .pc-price b { font-size: 13px; }
  .btn-view { font-size: 11px; padding: 8px; }
  .support-btn { font-size: 12px; padding: 14px 12px; }
  .support-btn svg { width: 18px; height: 18px; }
}
</style>
</head>
<body>

<header class="header">
  <a href="index.html" class="logo" id="siteLogo">CRAZY<span>FLIP</span></a>
  <nav class="nav-links">
    <a href="index.html">HOME</a>
    <a href="products.html">PRODUCTS</a>
  </nav>
</header>

<section class="banner-slider" id="bannerSlider">
  <div class="banner-slide active">
    <div style="background:#0a0a0a; padding:50px 20px; text-align:center;">
      <h2 style="font-size:22px; font-weight:900; letter-spacing:2px;">WELCOME TO CRAZY FLIP</h2>
    </div>
  </div>
</section>

<!-- SUPPORT SECTION -->
<section class="support-section">
  <div class="support-buttons" id="supportButtons">
    <!-- JS দিয়ে fill হবে -->
  </div>
</section>

<section class="products-section">
  <h2 class="section-title">OUR PRODUCTS</h2>
  <div class="products-grid" id="productsGrid">
    <div class="loading">Loading...</div>
  </div>
</section>

<footer class="footer">
  <div class="footer-contact" id="footerContact"></div>
  <p id="footerName">CRAZY FLIP © 2026</p>
</footer>

<script type="module">

console.log('🏠 Homepage loading...');

const firebaseConfig = {
  apiKey: "AIzaSyAtCagT7Al29I_WLsG4AFfy-DKGi_svA9A",
  authDomain: "crazy-flip-be56c.firebaseapp.com",
  databaseURL: "https://crazy-flip-be56c-default-rtdb.firebaseio.com",
  projectId: "crazy-flip-be56c",
  storageBucket: "crazy-flip-be56c.firebasestorage.app",
  messagingSenderId: "298724582283",
  appId: "1:298724582283:web:8e30164a256fe1fe96858e"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let banners = [], bannerIndex = 0, bannerTimer;
let currentSettings = {};

(async () => {
  try {
    /* SETTINGS */
    const sSnap = await get(ref(db, 'settings'));
    currentSettings = sSnap.val() || {};
    document.getElementById('footerName').textContent =
      (currentSettings.siteName || 'CRAZY FLIP') + ' © 2026';
    document.title = currentSettings.siteName || 'CRAZY FLIP';
    if (currentSettings.logo) {
      document.getElementById('siteLogo').innerHTML =
        `<img src="${currentSettings.logo}" style="height:28px" alt="logo"/>`;
    }

    /* ✅ SUPPORT + FOOTER CONTACT */
    renderSupport(currentSettings);

    /* BANNERS */
    const bSnap = await get(ref(db, 'banners'));
    const bData = bSnap.val() || {};
    banners = Object.keys(bData).map(id => ({ id, ...bData[id] }));
    console.log('🎨 Banners loaded:', banners.length);
    renderBanners();

    /* PRODUCTS */
    const pSnap = await get(ref(db, 'products'));
    const pData = pSnap.val() || {};
    const products = Object.keys(pData).map(id => ({ id, ...pData[id] }));
    console.log('📦 Products loaded:', products.length);
    renderProducts(products.slice(0, 12));
  } catch (e) {
    console.error('❌ Load error:', e);
    document.getElementById('productsGrid').innerHTML =
      '<div class="loading">Firebase connection failed.</div>';
  }
})();

/* ============ SUPPORT BUTTONS ============ */
function renderSupport(settings) {
  const wa = (settings.whatsapp || '').replace(/\D/g, '');
  const tg = (settings.telegram || '').replace('@', '');
  const waLink = wa ? `https://wa.me/${wa}` : '#';
  const tgLink = tg ? `https://t.me/${tg}` : '#';

  const supportBox = document.getElementById('supportButtons');
  const footerBox = document.getElementById('footerContact');

  /* Support Section buttons */
  if (wa || tg) {
    supportBox.innerHTML = `
      ${wa ? `
        <a href="${waLink}" target="_blank" class="support-btn whatsapp">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          WHATSAPP SUPPORT
        </a>
      ` : ''}
      ${tg ? `
        <a href="${tgLink}" target="_blank" class="support-btn telegram">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.944 0A12 12 0 000 12a12 12 0 0012 12 12 12 0 0012-12A12 12 0 0012 0a12 12 0 00-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 01.171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
          TELEGRAM SUPPORT
        </a>
      ` : ''}
    `;
  } else {
    supportBox.style.display = 'none';
  }

  /* Footer contact links */
  const footerLinks = [];
  if (wa) footerLinks.push(`<a href="${waLink}" target="_blank">💬 WhatsApp</a>`);
  if (tg) footerLinks.push(`<a href="${tgLink}" target="_blank">✈️ Telegram</a>`);
  footerBox.innerHTML = footerLinks.join('');
}

/* ============ BANNERS ============ */
function renderBanners() {
  const el = document.getElementById('bannerSlider');
  if (!banners.length) return;

  el.innerHTML = banners.map((b, i) => `
    <div class="banner-slide ${i === 0 ? 'active' : ''}">
      <img src="${b.image}" alt="${b.title || 'Banner'}"
        onerror="this.src='https://via.placeholder.com/1200x500/0a0a0a/fff?text=CRAZY+FLIP'"/>
      ${b.title ? `<div class="banner-title">${b.title}</div>` : ''}
    </div>
  `).join('') + `<div class="banner-dots">${
    banners.map((_, i) => `<span class="${i === 0 ? 'active' : ''}" data-i="${i}"></span>`).join('')
  }</div>`;

  el.querySelectorAll('.banner-dots span').forEach(dot => {
    dot.onclick = () => goBanner(+dot.dataset.i);
  });

  if (banners.length > 1) {
    bannerTimer = setInterval(() => goBanner((bannerIndex + 1) % banners.length), 4000);
  }
}

function goBanner(i) {
  bannerIndex = i;
  document.querySelectorAll('.banner-slide').forEach((s, idx) =>
    s.classList.toggle('active', idx === i));
  document.querySelectorAll('.banner-dots span').forEach((d, idx) =>
    d.classList.toggle('active', idx === i));
}

/* ============ PRODUCTS ============ */
function renderProducts(list) {
  const grid = document.getElementById('productsGrid');
  if (!list.length) {
    grid.innerHTML = '<div class="loading">No products yet.</div>';
    return;
  }
  grid.innerHTML = list.map((p, i) => `
    <div class="product-card" style="animation-delay:${i * .05}s">
      <img src="${p.image}" alt="${p.name}"
        onerror="this.src='https://via.placeholder.com/400x400/111/fff?text=CF'"/>
      <div class="pc-body">
        <div class="pc-name">${p.name}</div>
        <div class="pc-price">Starting <b>GH₵ ${p.plans?.[0]?.price ?? 0}</b></div>
        <a href="product-details.html?id=${p.id}" class="btn-view">VIEW PRODUCT</a>
      </div>
    </div>
  `).join('');
}

</script>

</body>
</html>
