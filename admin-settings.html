<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Website Settings — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="admin-wrap">
  <aside class="sidebar">
    <a href="index.html" class="side-logo">CRAZY<span>FLIP</span></a>
    <nav>
      <a class="nav-btn" href="admin.html">📊 Dashboard</a>
      <a class="nav-btn" href="admin-orders.html">📦 Orders</a>
      <a class="nav-btn" href="admin-products.html">🛍️ Products</a>
      <a class="nav-btn" href="admin-banner.html">🖼️ Banner Manager</a>
      <a class="nav-btn active" href="admin-settings.html">⚙️ Website Settings</a>
    </nav>
  </aside>

  <main class="main">
    <h1>Website Settings</h1>

    <div class="form-card">
      <label>Website Name</label>
      <input id="setSiteName" type="text" placeholder="CRAZY FLIP" />

      <label>Logo URL</label>
      <input id="setLogo" type="text" placeholder="https://..." />

      <label>Ghana MoMo Number</label>
      <input id="setMomo" type="text" placeholder="024XXXXXXX" />

      <label>Account Name</label>
      <input id="setAcc" type="text" />

      <label>Payment Text</label>
      <textarea id="setPayText" rows="3"></textarea>

      <label>WhatsApp Number (Admin) +233...</label>
      <input id="setWhatsapp" type="text" placeholder="+233XXXXXXXXX" />

      <label>Telegram Username (@ ছাড়া)</label>
      <input id="setTelegram" type="text" placeholder="username" />

      <button class="save-btn" id="saveBtn">SAVE SETTINGS</button>
    </div>
  </main>
</div>

<script type="module">

const firebaseConfig = {
  apiKey: "AIzaSyAtCagT7Al29I_WLsG4AFfy-DKGi_svA9A",
  authDomain: "crazy-flip-be56c.firebaseapp.com",
  databaseURL: "https://crazy-flip-be56c-default-rtdb.firebaseio.com",
  projectId: "crazy-flip-be56c",
  storageBucket: "crazy-flip-be56c.firebasestorage.app",
  messagingSenderId: "298724582283",
  appId: "1:298724582283:web:8e30164a256fe1fe96858e"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

(async () => {
  try {
    const snap = await get(ref(db, 'settings'));
    const s = snap.val() || {};
    document.getElementById('setSiteName').value = s.siteName || '';
    document.getElementById('setLogo').value = s.logo || '';
    document.getElementById('setMomo').value = s.momoNumber || '';
    document.getElementById('setAcc').value = s.accountName || '';
    document.getElementById('setPayText').value = s.paymentText || '';
    document.getElementById('setWhatsapp').value = s.whatsapp || '';
    document.getElementById('setTelegram').value = s.telegram || '';
  } catch (e) {
    console.error(e);
  }

  document.getElementById('saveBtn').onclick = async () => {
    const btn = document.getElementById('saveBtn');
    try {
      btn.textContent = 'SAVING...';
      btn.disabled = true;

      await update(ref(db, 'settings'), {
        siteName: document.getElementById('setSiteName').value.trim(),
        logo: document.getElementById('setLogo').value.trim(),
        momoNumber: document.getElementById('setMomo').value.trim(),
        accountName: document.getElementById('setAcc').value.trim(),
        paymentText: document.getElementById('setPayText').value.trim(),
        whatsapp: document.getElementById('setWhatsapp').value.trim(),
        telegram: document.getElementById('setTelegram').value.trim()
      });
      alert('✅ Settings saved!');
      btn.textContent = 'SAVE SETTINGS';
      btn.disabled = false;
    } catch (err) {
      console.error(err);
      alert('❌ Failed: ' + err.message);
      btn.textContent = 'SAVE SETTINGS';
      btn.disabled = false;
    }
  };
})();

</script>

</body>
</html>
